[package]
name = "zarrs_icechunk"
version = "0.6.0"
authors = ["Lachlan Deakin <ljdgit@gmail.com>"]
edition = "2021"
rust-version = "1.95"
description = "icechunk store support for the zarrs crate"
homepage = "https://zarrs.dev"
documentation = "https://docs.rs/zarrs_icechunk"
repository = "https://github.com/zarrs/zarrs_icechunk"
license = "MIT OR Apache-2.0"
keywords = ["zarr", "zarrs", "storage", "store", "icechunk"]
categories = ["encoding"]

[features]
# Forward icechunk's storage-backend features so downstream crates can opt out
# of heavy backends they don't use (e.g. the `s3` backend pulls the full
# `aws-sdk-s3` dependency tree; `object-store-s3` is a lighter `object_store`
# backend). `default` preserves the previous behaviour — icechunk's own default
# backend set — so this is a non-breaking change: existing dependents keep every
# backend they had unless they opt out with `default-features = false`.
default = [
  "s3",
  "object-store-s3",
  "object-store-gcs",
  "object-store-azure",
  "object-store-http",
  "object-store-fs",
  "redirect",
]
s3 = ["icechunk/s3"]
object-store-s3 = ["icechunk/object-store-s3"]
object-store-gcs = ["icechunk/object-store-gcs"]
object-store-azure = ["icechunk/object-store-azure"]
object-store-http = ["icechunk/object-store-http"]
object-store-fs = ["icechunk/object-store-fs"]
redirect = ["icechunk/redirect"]

[dependencies]
async-trait = "0.1.74"
futures = "0.3.29"
icechunk = { version = "~2.3.0", default-features = false }
tokio = "1.34.0"
zarrs_storage = { version = "0.4.0", features = ["async"] }

[[example]]
name = "virtualizarr_netcdf"
doc-scrape-examples = true

[dev-dependencies]
serde_json = "1.0.140"
tempfile = "3"
tokio = { version = "1.34.0", features = ["macros", "rt-multi-thread"] }
tokio-test = "0.4.4"
ndarray = "0.17"
zarrs = { version = "0.23.0", features = [
  "async",
  "sharding",
  "gzip",
  "fletcher32",
  "zlib",
  "ndarray",
] }
zarrs_storage = { version = "0.4.0", features = ["async", "tests"] }

[patch.crates-io]
# zarrs = { git = "https://github.com/zarrs/zarrs.git", tag = "zarrs-v0.22.0-beta.2" }
# zarrs_storage = { git = "https://github.com/zarrs/zarrs.git", tag = "zarrs-v0.22.0-beta.2" }
